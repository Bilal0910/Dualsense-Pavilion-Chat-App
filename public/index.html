<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/styles.min.css">
        <link rel="icon" href="./img/logo.png">
        <title>DualSense Pavilion</title>
    </head>
    <body>
        <!-- Main Container -->
        <div class="container">
            <!-- Left Side: List of Rooms -->
            <div class="room-list">
                <div class="logo-container">
                    <img src="./img/logo.png" alt="PlayStation Logo" class="playstation-logo">
                </div>
                <h2>Choose a Chat Zone</h2>
                <ul class="rooms" id="rooms-list">
                    <li class="room">1. The Witcher Club</li>
                    <li class="room">2. Hogwarts Legacy Club</li>
                    <li class="room">3. The Last of Us Club</li>
                    <li class="room">4. Grand Theft Auto Club</li>
                    <li class="room">5. Call of Duty Club</li>
                </ul>
            </div>
            
            <!-- Right Side: Join Form -->
            <div class="join-form">
                <h1>JOIN THE CLUB & ENJOY</h1>
                <form action="/chat.html">
                    <label for="username">Display Name</label>
                    <input type="text" name="username" placeholder="Display name" required>

                    <label for="room">Enter Room Name</label>
                    <input type="text" name="room" placeholder="Room Name" required>

                    <button type="submit">Join</button>
                </form>
            </div>
        </div>
    </body>
</html>
